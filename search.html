<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=17">
</head>
<body>

<header class="site-head">
  <div class="site-head-inner">
    <a class="masthead" href="/">
      <span class="mark">Blue Team <b>of One</b></span>
      <span class="tag">field notes · security</span>
    </a>
    <nav class="site-nav">
      <a href="/email/">Email</a>

      <a href="/about.html">About</a>
      <a href="/search.html" aria-current="page">Search</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="phead center">
      <p class="kicker">Blue Team of One</p>
      <h1>Search the field notes</h1>
      <p class="tagline">Find a post by title, topic, or any term inside it.</p>
    </div>

    <div class="search-wrap">
      <input id="q" class="search-box" type="search" placeholder="Try “clickfix”, “litigation hold”, “DMARC”, “token”…" autocomplete="off" autofocus>
      <p class="search-meta" id="meta"></p>
      <div class="search-results" id="results"></div>
    </div>
  </div>
</main>

<footer><div class="wrap">
  <span>© 2026 Ram Mudigina · Blue Team of One</span>
  <span><a href="/">Home</a> · <a href="/about.html">About</a> · <a href="https://www.linkedin.com/in/ram-mudigina/">LinkedIn</a></span>
</div></footer>

<script>
(function(){
  var q = document.getElementById('q');
  var results = document.getElementById('results');
  var meta = document.getElementById('meta');
  var DOCS = [];

  fetch('/assets/search-index.json')
    .then(function(r){ return r.json(); })
    .then(function(d){ DOCS = d; render(''); })
    .catch(function(){ meta.textContent = 'Could not load the search index.'; });

  function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function highlight(text, terms){
    if(!terms.length) return text;
    var re = new RegExp('(' + terms.map(esc).join('|') + ')', 'ig');
    return text.replace(re, '<mark>$1</mark>');
  }

  function score(doc, terms){
    var s = 0;
    var title = doc.title.toLowerCase();
    var meta = (doc.vertical + ' ' + doc.section + ' ' + doc.excerpt).toLowerCase();
    var body = doc.text.toLowerCase();
    for(var i=0;i<terms.length;i++){
      var t = terms[i];
      if(title.indexOf(t) !== -1) s += 10;
      if(meta.indexOf(t) !== -1) s += 4;
      var idx = body.indexOf(t), hits = 0;
      while(idx !== -1 && hits < 5){ s += 1; hits++; idx = body.indexOf(t, idx + t.length); }
    }
    return s;
  }

  function card(doc, terms){
    var a = document.createElement('a');
    a.className = 'sresult';
    a.href = doc.url;
    a.innerHTML =
      '<span class="r-cat">' + doc.vertical + (doc.section ? ' › ' + doc.section : '') + '</span>' +
      '<h3>' + highlight(doc.title, terms) + '</h3>' +
      '<p>' + highlight(doc.excerpt, terms) + '</p>';
    return a;
  }

  function render(query){
    var terms = query.toLowerCase().split(/\s+/).filter(Boolean);
    results.innerHTML = '';
    var list;
    if(!terms.length){
      list = DOCS.slice();
      meta.textContent = 'Browsing all ' + DOCS.length + ' field notes — start typing to search.';
    } else {
      list = DOCS.map(function(d){ return {doc:d, s:score(d, terms)}; })
                 .filter(function(x){ return x.s > 0; })
                 .sort(function(a,b){ return b.s - a.s; })
                 .map(function(x){ return x.doc; });
      meta.textContent = list.length
        ? list.length + ' result' + (list.length===1?'':'s') + ' for “' + query + '”'
        : '';
    }
    if(!list.length){
      var e = document.createElement('div');
      e.className = 'search-empty';
      e.innerHTML = 'No field notes match “' + query.replace(/</g,'&lt;') + '”.<br>Try a broader term, or <a href="/">browse by vertical</a>.';
      results.appendChild(e);
      return;
    }
    for(var i=0;i<list.length;i++) results.appendChild(card(list[i], terms));
  }

  q.addEventListener('input', function(){ render(q.value.trim()); });
})();
</script>

</body>
</html>
